# CI for the sports-scores monorepo.
# Runs api/ type-check + tests, client lint+typecheck+build+unit tests,
# and Playwright e2e tests (desktop + mobile Chrome).

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api:
    name: API tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check api/, scripts/ and test/
        run: npm run typecheck

      - name: Run API tests
        run: npm test

  client:
    name: Client lint + build + unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Type-check
        working-directory: client
        run: npm run typecheck

      - name: Unit tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

  e2e:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    needs: client  # Only run after lint/build/unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install chromium --with-deps

      - name: Build app for preview
        working-directory: client
        run: npm run build

      - name: Run Playwright e2e tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
